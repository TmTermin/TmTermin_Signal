<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>XAUUSD Signals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-apps.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #070910; --surface: rgba(22,26,36,0.6);
    --gold: #D9AE57; --gold-dim: rgba(217,174,87,0.35); --gold-glow: rgba(217,174,87,0.22);
    --bull: #4FE0C2; --bull-dim: rgba(79,224,194,0.35); --bull-glow: rgba(79,224,194,0.25);
    --bear: #FF6E5A; --bear-dim: rgba(255,110,90,0.4); --bear-glow: rgba(255,110,90,0.28);
    --text: #EDEBE4; --text-muted: #8E93A1; --border: rgba(217,174,87,0.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", "Noto Sans SC", -apple-system, sans-serif;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); overflow-x: hidden; position: relative; }
  .mono { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

  .bg-deco { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg-glow-gold { position: absolute; top: -18%; right: -25%; width: 70vw; height: 70vw; max-width: 520px; max-height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(217,174,87,0.22), rgba(217,174,87,0.04) 45%, transparent 70%);
    animation: driftGold 16s ease-in-out infinite alternate; }
  .bg-glow-teal { position: absolute; bottom: -20%; left: -20%; width: 60vw; height: 60vw; max-width: 460px; max-height: 460px; border-radius: 50%;
    background: radial-gradient(circle, rgba(79,224,194,0.1), transparent 65%); animation: driftTeal 20s ease-in-out infinite alternate; }
  @keyframes driftGold { from { transform: translate(0,0) scale(1); } to { transform: translate(-18px,16px) scale(1.08); } }
  @keyframes driftTeal { from { transform: translate(0,0) scale(1); } to { transform: translate(14px,-18px) scale(1.06); } }
  .bg-stars { position: absolute; inset: 0; opacity: 0.45;
    background-image: radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 120px 80px, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 60px 160px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 200px 50px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 260px 220px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 320px 120px, rgba(255,255,255,0.3), transparent);
    background-repeat: repeat; background-size: 380px 380px; animation: twinkle 5s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: 0.3; } to { opacity: 0.55; } }
  .bg-particle { position: absolute; border-radius: 50%; background: var(--gold); filter: blur(0.5px); opacity: 0; }
  .bg-particle.p1 { width: 3px; height: 3px; left: 18%; bottom: -5%; box-shadow: 0 0 8px rgba(217,174,87,0.7); animation: floatUp 11s ease-in infinite; animation-delay: 0s; }
  .bg-particle.p2 { width: 2px; height: 2px; left: 62%; bottom: -5%; background: var(--bull); box-shadow: 0 0 6px rgba(79,224,194,0.7); animation: floatUp 14s ease-in infinite; animation-delay: 3.5s; }
  .bg-particle.p3 { width: 2.5px; height: 2.5px; left: 82%; bottom: -5%; box-shadow: 0 0 7px rgba(217,174,87,0.6); animation: floatUp 9.5s ease-in infinite; animation-delay: 6s; }
  .bg-particle.p4 { width: 2px; height: 2px; left: 38%; bottom: -5%; background: var(--bull); box-shadow: 0 0 6px rgba(79,224,194,0.6); animation: floatUp 12.5s ease-in infinite; animation-delay: 8.5s; }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(0) translateX(0); } 10% { opacity: 0.8; } 90% { opacity: 0.5; } 100% { opacity: 0; transform: translateY(-105vh) translateX(18px); } }

  #app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  header.top { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px; position: relative; gap: 8px; }
  .pair-select { display: flex; align-items: center; gap: 10px; background: none; border: none; cursor: pointer; min-width: 0; }
  .pair-icon { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(145deg, #F0CB7A, #A9792F); flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight:700; color:#2a1d05;
    animation: iconBreathe 3.2s ease-in-out infinite; }
  @keyframes iconBreathe { 0%,100% { box-shadow: 0 0 14px var(--gold-glow), inset 0 1px 1px rgba(255,255,255,0.4); } 50% { box-shadow: 0 0 26px var(--gold-glow), inset 0 1px 1px rgba(255,255,255,0.4); } }
  .pair-name { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 0.3px; display: flex; align-items: center; gap: 4px; text-shadow: 0 0 16px var(--gold-glow); white-space: nowrap; }
  .pair-sub { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .icon-btn { height: 36px; min-width: 36px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); backdrop-filter: blur(10px);
    color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; font-family:"IBM Plex Mono",monospace; font-size: 11.5px; font-weight: 600; }

  .pair-dropdown, .lang-dropdown { position: absolute; top: 56px; z-index: 30;
    background: rgba(16,19,27,0.96); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 14px;
    padding: 6px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: none; }
  .pair-dropdown { left: 16px; right: 16px; }
  .lang-dropdown { right: 16px; width: 170px; }
  .pair-dropdown.open, .lang-dropdown.open { display: block; animation: dropIn .18s ease; }
  @keyframes dropIn { from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  .pair-opt, .lang-opt { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; transition: background .15s; }
  .pair-opt:hover, .pair-opt.active, .lang-opt:hover, .lang-opt.active { background: rgba(217,174,87,0.1); }
  .pair-opt .ic { width: 28px; height: 28px; border-radius: 8px; background: rgba(217,174,87,0.15); color: var(--gold);
    display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; flex: 0 0 auto; }
  .pair-opt .nm { font-weight: 600; font-size: 14px; } .pair-opt .sb { font-size: 11px; color: var(--text-muted); }
  .pair-opt { position: relative; }
  .star-btn { margin-left: auto; background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px 6px; color: rgba(255,255,255,0.25); flex: 0 0 auto; }
  .star-btn.fav { color: var(--gold); filter: drop-shadow(0 0 6px var(--gold-glow)); }
  .lang-opt { font-size: 13.5px; font-weight: 500; }

  .tf-row { display: flex; gap: 5px; padding: 8px 16px 14px; overflow-x: auto; scrollbar-width: none; }
  .tf-row::-webkit-scrollbar { display: none; }
  .tf-pill { flex: 0 0 auto; padding: 6px 11px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: var(--surface);
    backdrop-filter: blur(10px); color: var(--text-muted); font-family: "IBM Plex Mono", monospace; font-size: 11.5px; cursor: pointer;
    transition: border-color .15s, color .15s, box-shadow .2s, transform .1s; }
  .tf-pill:active { transform: scale(0.94); }
  .tf-pill.active { color: var(--gold); border-color: var(--gold-dim); box-shadow: 0 0 12px var(--gold-glow); }

  .view { display: none; flex: 1; padding: 0 16px 100px; }
  .view.active { display: block; }
  @keyframes slideInRight { from { opacity: 0; transform: translateX(34px) scale(0.99); } to { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes slideInLeft { from { opacity: 0; transform: translateX(-34px) scale(0.99); } to { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(26px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes pulseUpdate { 0% { text-shadow: 0 0 0 transparent; } 30% { text-shadow: 0 0 14px var(--gold-glow); } 100% { text-shadow: 0 0 0 transparent; } }
  .pulse-update { animation: pulseUpdate .7s ease; }
  .section-title { font-size: 13px; color: var(--text-muted); margin: 16px 2px 10px; display:flex; align-items:center; justify-content:space-between; }

  .card { position: relative; background: linear-gradient(155deg, rgba(26,31,42,0.78), rgba(14,17,24,0.6)); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 16px; margin-bottom: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04); overflow: hidden;
    animation: cardGlowPulse 4.5s ease-in-out infinite; }
  @keyframes cardGlowPulse { 0%,100% { box-shadow: 0 10px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04), 0 0 0 rgba(217,174,87,0); }
    50% { box-shadow: 0 10px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04), 0 0 22px rgba(217,174,87,0.06); } }
  .card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(100deg, transparent 42%, rgba(217,174,87,0.055) 50%, transparent 58%);
    background-size: 260% 260%; animation: scanSweep 8s linear infinite;
  }
  @keyframes scanSweep { 0% { background-position: 220% 0%; } 100% { background-position: -60% 0%; } }
  .card > * { position: relative; z-index: 1; }
  .card .corner { position: absolute; width: 14px; height: 14px; z-index: 2; }
  .card .corner.tl { top: 8px; left: 8px; border-top: 1.5px solid var(--c-accent,var(--gold)); border-left: 1.5px solid var(--c-accent,var(--gold)); border-radius: 4px 0 0 0; }
  .card .corner.br { bottom: 8px; right: 8px; border-bottom: 1.5px solid var(--c-accent,var(--gold)); border-right: 1.5px solid var(--c-accent,var(--gold)); border-radius: 0 0 4px 0; }

  .chart-wrap { position: relative; border-radius: 12px; overflow: hidden; background: rgba(0,0,0,0.2); }
  .chart-wrap canvas { width: 100%; display: block; cursor: grab; }
  .chart-wrap canvas:active { cursor: grabbing; }
  .crosshair-box { position: absolute; pointer-events: none; background: rgba(10,12,18,0.92); border: 1px solid var(--gold-dim);
    border-radius: 6px; padding: 4px 8px; font-family:"IBM Plex Mono",monospace; font-size: 11px; color: var(--text); opacity: 0; white-space: nowrap; }
  .chart-hint { font-size: 10px; color: var(--text-muted); text-align: center; margin-top: 6px; opacity: 0.7; }

  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bull); display: inline-block; margin-right: 6px;
    box-shadow: 0 0 8px var(--bull-glow); animation: liveBlink 1.6s ease-in-out infinite; }
  @keyframes liveBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .price-now { font-family:"IBM Plex Mono",monospace; font-size: 24px; font-weight: 600; transition: color .3s; }
  .price-now.flash-up { color: var(--bull); } .price-now.flash-down { color: var(--bear); }
  .price-chg { font-size: 13px; margin-left: 8px; }
  .price-chg.up { color: var(--bull); text-shadow: 0 0 10px var(--bull-glow); }
  .price-chg.down { color: var(--bear); text-shadow: 0 0 10px var(--bear-glow); }

  .analyze-btn { width: 100%; padding: 15px; border-radius: 14px; font-weight: 600; font-size: 14.5px; cursor: pointer; margin-top: 14px;
    border: 1px solid var(--gold-dim); color: var(--bg); background: linear-gradient(135deg, #F0CB7A, var(--gold));
    box-shadow: 0 0 24px var(--gold-glow); display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .1s, box-shadow .3s; animation: btnPulse 2.8s ease-in-out infinite; }
  @keyframes btnPulse { 0%,100% { box-shadow: 0 0 18px var(--gold-glow); } 50% { box-shadow: 0 0 30px var(--gold-glow); } }
  .analyze-btn:active { transform: scale(0.97); }
  .analyze-btn.loading { pointer-events: none; opacity: 0.85; animation: none; }
  .spinner { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(7,9,16,0.25); border-top-color: #070910; animation: spin .7s linear infinite; display: none; }
  .analyze-btn.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result-panel { margin-top: 14px; padding: 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03); display: none; }
  .result-panel.show { display: block; animation: resultIn .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes resultIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .result-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .result-dir { font-size: 20px; font-weight: 700; }
  .result-dir.bull { color: var(--bull); text-shadow: 0 0 12px var(--bull-glow); }
  .result-dir.bear { color: var(--bear); text-shadow: 0 0 12px var(--bear-glow); }
  .conf-pill { margin-left: auto; font-family:"IBM Plex Mono",monospace; font-size: 13px; padding: 4px 10px; border-radius: 999px;
    background: rgba(217,174,87,0.12); color: var(--gold); border: 1px solid rgba(217,174,87,0.25); }
  .levels-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .level-box { text-align: center; background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px 4px; }
  .level-box .lv-label { font-size: 10.5px; color: var(--text-muted); margin-bottom: 4px; }
  .level-box .lv-val { font-family:"IBM Plex Mono",monospace; font-weight: 600; font-size: 13.5px; }
  .level-box.entry .lv-val { color: var(--gold); } .level-box.tp .lv-val { color: var(--bull); } .level-box.sl .lv-val { color: var(--bear); }
  .reason-text { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; margin-top: 12px; }
  .mtf-badge { margin-top: 10px; font-size: 11.5px; padding: 6px 10px; border-radius: 8px; display: inline-block; }
  .mtf-badge.agree { background: rgba(79,224,194,0.1); color: var(--bull); border: 1px solid rgba(79,224,194,0.25); }
  .mtf-badge.conflict { background: rgba(255,110,90,0.1); color: var(--bear); border: 1px solid rgba(255,110,90,0.25); }
  .stale-warning { margin-top: 10px; font-size: 11.5px; padding: 8px 10px; border-radius: 10px; background: rgba(255,110,90,0.08);
    color: var(--bear); border: 1px solid rgba(255,110,90,0.2); display: none; }
  .stale-warning.show { display: block; animation: resultIn .3s ease; }

  .day-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .day-tab { flex: 1; text-align: center; padding: 9px 4px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
    background: var(--surface); color: var(--text-muted); font-size: 12.5px; cursor: pointer; transition: all .15s; }
  .day-tab.active { color: var(--gold); border-color: var(--gold-dim); box-shadow: 0 0 12px var(--gold-glow); background: rgba(217,174,87,0.08); }
  .curr-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .curr-chips::-webkit-scrollbar { display: none; }
  .curr-chip { flex: 0 0 auto; padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03); color: var(--text-muted); font-size: 11.5px; cursor: pointer; transition: all .15s; }
  .curr-chip.active { color: var(--gold); border-color: var(--gold-dim); }

  .news-item { cursor: pointer; transition: transform .1s; }
  .news-item:active { transform: scale(0.99); }
  .news-item-head { display: flex; align-items: center; gap: 10px; }
  .news-item-main { flex: 1; }
  .news-item-main .nm { font-weight: 600; font-size: 14px; }
  .news-item-main .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
  .news-item-right { text-align: right; }
  .news-item-right .tm { font-size: 11px; color: var(--text-muted); font-family:"IBM Plex Mono",monospace; }
  .impact-tag { margin-top: 5px; display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 999px; font-family:"IBM Plex Mono",monospace; }
  .impact-high { background: rgba(255,110,90,0.14); color: var(--bear); }
  .impact-medium { background: rgba(217,174,87,0.14); color: var(--gold); }
  .impact-low { background: rgba(142,147,161,0.12); color: var(--text-muted); }
  .news-detail { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  .news-detail.open { max-height: 220px; }
  .news-detail-inner { padding-top: 12px; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.07); }
  .news-pred { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; }
  .news-pred .arrow { font-size: 16px; filter: drop-shadow(0 0 6px currentColor); }
  .news-pred.bull .arrow, .news-pred.bull .pct { color: var(--bull); } .news-pred.bear .arrow, .news-pred.bear .pct { color: var(--bear); }
  .news-pred .pct { font-family:"IBM Plex Mono",monospace; font-weight: 600; margin-left: auto; }

  .consensus-banner { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-radius: 14px; margin-bottom: 14px;
    border: 1px solid var(--border); background: linear-gradient(135deg, rgba(217,174,87,0.08), rgba(217,174,87,0.02)); }
  .consensus-banner .cb-dir { font-size: 15px; font-weight: 700; }
  .consensus-banner .cb-dir.bull { color: var(--bull); } .consensus-banner .cb-dir.bear { color: var(--bear); }
  .consensus-banner .cb-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .consensus-banner .cb-score { margin-left: auto; font-family:"IBM Plex Mono",monospace; font-weight: 700; font-size: 18px; }

  .strat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
  .strat-card { border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: var(--surface); backdrop-filter: blur(10px);
    padding: 13px; cursor: pointer; transition: border-color .15s, box-shadow .2s, transform .1s; }
  .strat-card:active { transform: scale(0.97); }
  .strat-card.active { border-color: var(--gold-dim); box-shadow: 0 0 16px var(--gold-glow); background: rgba(217,174,87,0.07); }
  .strat-card .sc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .strat-card .sc-icon { font-size: 16px; } .strat-card .sc-name { font-size: 12.5px; font-weight: 600; }
  .strat-card .sc-verdict { display: flex; align-items: center; gap: 6px; font-family:"IBM Plex Mono",monospace; font-size: 12px; }
  .strat-card .sc-verdict.bull { color: var(--bull); } .strat-card .sc-verdict.bear { color: var(--bear); }

  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-width: 480px; margin: 0 auto;
    background: rgba(10,12,18,0.85); backdrop-filter: blur(18px); border-top: 1px solid rgba(217,174,87,0.12);
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-around; }
  .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text-muted); font-size: 10.5px; cursor: pointer; padding: 4px 10px; transition: transform .15s, color .15s; }
  .nav-btn:active { transform: scale(0.9); }
  .nav-btn svg { width: 19px; height: 19px; transition: filter .15s; }
  .nav-btn.active { color: var(--gold); } .nav-btn.active svg { filter: drop-shadow(0 0 6px var(--gold-glow)); }

  .muted-small { color: var(--text-muted); font-size: 12px; }
  .back-link { background: none; border: none; color: var(--text); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 14px 0 10px; }

  .hist-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 12.5px; }
  .hist-row:last-child { border-bottom: none; }
  .hist-row.new { animation: histIn .4s ease; }
  @keyframes histIn { from { opacity: 0; transform: translateX(-8px); background: rgba(217,174,87,0.12); } to { opacity: 1; transform: translateX(0); background: transparent; } }
  .hist-res { width: 20px; height: 20px; border-radius: 50%; display:flex;align-items:center;justify-content:center; font-size: 11px; flex: 0 0 auto;}
  .hist-res.win { background: rgba(79,224,194,0.14); color: var(--bull); box-shadow: 0 0 10px var(--bull-glow); }
  .hist-res.loss { background: rgba(255,110,90,0.14); color: var(--bear); box-shadow: 0 0 10px var(--bear-glow); }
  .hist-mid { flex: 1; }
  .hist-mid .pr { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }

<script>
/* ============================================================ TELEGRAM WEB APP SDK ============================================================
   All Telegram-specific calls are guarded behind `tg` so the app degrades
   gracefully (and keeps working identically) when opened outside Telegram
   or when telegram-web-apps.js fails to load (e.g. in this preview sandbox,
   whose content-security-policy does not allow scripts from telegram.org).
================================================================================================= */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

function haptic(type) {
  if (!tg || !tg.HapticFeedback) return;
  try {
    if (type === 'light' || type === 'medium' || type === 'heavy') tg.HapticFeedback.impactOccurred(type);
    else if (type === 'success' || type === 'error' || type === 'warning') tg.HapticFeedback.notificationOccurred(type);
    else if (type === 'selection') tg.HapticFeedback.selectionChanged();
  } catch(e) {}
}

function initTelegram() {
  if (!tg) return;
  try {
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); // avoid conflict with our own pull-to-refresh gesture
    if (tg.setHeaderColor) tg.setHeaderColor('#070910');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#070910');
    tg.BackButton.onClick(() => {
      if (document.getElementById('view-settings').classList.contains('active')) closeSettings();
      else if (compareState.open) toggleCompare();
    });
  } catch(e) {}
}
function tgUser() {
  return (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
}

/* ---- CloudStorage: persist settings across sessions/devices (Telegram only) ---- */
function saveToCloud() {
  if (!tg || !tg.CloudStorage) return;
  const data = JSON.stringify({
    mode: settingsState.mode,
    enabledPairs: [...settingsState.enabledPairs],
    watchlist: [...settingsState.watchlist],
    notifyHigh: settingsState.notifyHigh, notifyMedium: settingsState.notifyMedium, notifyLow: settingsState.notifyLow,
    lang: state.lang,
  });
  try { tg.CloudStorage.setItem('app_settings', data); } catch(e) {}
}
function loadFromCloud() {
  if (!tg || !tg.CloudStorage) return;
  try {
    tg.CloudStorage.getItem('app_settings', (err, value) => {
      if (err || !value) return;
      try {
        const d = JSON.parse(value);
        if (d.mode) settingsState.mode = d.mode;
        if (d.enabledPairs) settingsState.enabledPairs = new Set(d.enabledPairs);
        if (d.watchlist) settingsState.watchlist = new Set(d.watchlist);
        if (d.notifyHigh !== undefined) settingsState.notifyHigh = d.notifyHigh;
        if (d.notifyMedium !== undefined) settingsState.notifyMedium = d.notifyMedium;
        if (d.notifyLow !== undefined) settingsState.notifyLow = d.notifyLow;
        buildCurrChips(); buildPairDropdown();
        if (d.lang) applyLanguage(d.lang);
      } catch(e) {}
    });
  } catch(e) {}
}

    pred_label:'Predicted direction', forecast_word:'forecast', vs_word:'vs', no_news:'no news found', signals_count:'signals',
    of_strategies:'strategies', avg_confidence:'avg. confidence', chart_hint:'← drag to pan · pinch or scroll to zoom →',
    back:'Back', title_mode:'Trading mode', title_pairs:'Watched pairs', title_notif:'Notifications',
    mode_scalp:'Scalping', mode_scalp_sub:'Fast, frequent signals (1m-15m)', mode_swing:'Swing', mode_swing_sub:'Fewer, more reliable (4H-1D)',

function calcRSI(candles, period) {

    if (i < period) { gainSum += gain; lossSum += loss; continue; }

}

  }

    pan.start = Math.round(centerIdx - pan.count/2);
  }

    if (levels) { min = Math.min(min, levels.tp, levels.sl); max = Math.max(max, levels.tp, levels.sl); }

      ctx.stroke();
      if (levels) {
        const lv = [{v:levels.entry,color:'#D9AE57',label:t('lv_entry')},{v:levels.tp,color:'#4FE0C2',label:'TP'},{v:levels.sl,color:'#FF6E5A',label:'SL'}];
        lv.forEach(l => {
          const y = Y(l.v);
          ctx.strokeStyle = l.color; ctx.setLineDash([4,3]); ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = l.color; ctx.font = '600 10px IBM Plex Mono, monospace'; ctx.textAlign='left';
          ctx.fillText(l.label+' '+fmt(l.v,decimals), W-padR+6, y+3);

      }

        markers.forEach(m => {

          if (localIdx < 0 || localIdx >= win.length) return;
          const mx = X(localIdx), my = Y(m.entry);

          ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 1;
          ctx.beginPath();
          if (m.bullish) { ctx.moveTo(mx, my+9); ctx.lineTo(mx-5, my+18); ctx.lineTo(mx+5, my+18); }
          else { ctx.moveTo(mx, my-9); ctx.lineTo(mx-5, my-18); ctx.lineTo(mx+5, my-18); }

  function onDown(clientX) { dragging = true; dragStartX = clientX; dragStartPan = pan.start; crossBox.style.opacity = 0; }

    ctx.beginPath(); ctx.moveTo(padL, cy); ctx.lineTo(W-padR, cy); ctx.stroke(); ctx.setLineDash([]);
    const priceAtY = lastSc.max - ((cy - padT)/lastSc.innerH) * lastSc.range;
    crossBox.style.opacity = 1;
    crossBox.style.left = Math.min(relX+10, rect.width-110) + 'px';
    crossBox.style.top = Math.max(relY-28, 0) + 'px';

    if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (activePointers.size === 2 && pinchStartDist) {

      const ratio = pinchStartDist / Math.max(d, 1);
      pan.count = Math.round(pinchStartCount * ratio);
      pan.count = Math.max(MIN_COUNT, Math.min(MAX_COUNT, pan.count));

  if (isTick && lastSigPrice !== null) {
    animateNumber(priceEl, lastSigPrice, last, p.decimals, 400);
    priceEl.classList.remove('flash-up','flash-down'); void priceEl.offsetWidth;
    priceEl.classList.add(last >= lastSigPrice ? 'flash-up' : 'flash-down');
    setTimeout(()=>priceEl.classList.remove('flash-up','flash-down'), 700);
  } else { priceEl.textContent = fmt(last, p.decimals); }
  lastSigPrice = last;
  const chgEl = document.getElementById('sigChg');
  chgEl.textContent = (chg>=0?'+':'') + chg.toFixed(2) + '%';
  chgEl.className = 'price-chg mono ' + (chg>=0?'up':'down');
  const sigMarkers = SIGNAL_MARKERS[state.pair+'_'+state.tf];
  createChart(document.getElementById('sigCanvas'), document.getElementById('sigCross'), candles, p.decimals, null, sigMarkers);

}

const HIGHER_TF = { '1m':'15m', '5m':'30m', '15m':'1H', '30m':'4H', '1H':'4H', '4H':'1D', '1D':'1D' };
function getHigherTFTrend() {
  const higherTf = HIGHER_TF[state.tf];
  if (!higherTf || higherTf === state.tf) return null;
  const hc = getCandles(state.pair, higherTf);
  const ind = computeAllIndicators(hc);
  const i = hc.length - 1;
  return { tf: higherTf, bullish: ind.ema20[i] > ind.ema50[i] };
}

let lastSigRes = null, lastAnaRes = null;
function analyzeCandles(candles, strategyId) {
  const ind = computeAllIndicators(candles);
  const i = candles.length - 1;
  const last = candles[i].close;
  let bullish, confidence, extra = '';

  if (strategyId === 'trend') {
    const e20 = ind.ema20[i], e50 = ind.ema50[i];
    const adxVal = ind.adx.adx[i] || 18;
    bullish = e20 > e50;
    confidence = Math.min(94, Math.max(52, 50 + Math.round(adxVal * 1.3)));
    extra = ' (ADX ' + adxVal.toFixed(1) + ')';
  } else if (strategyId === 'breakout') {
    const upper = ind.boll.upper[i], lower = ind.boll.lower[i], sma = ind.boll.sma[i];
    const distUpper = (upper-last)/(upper-sma||1), distLower = (last-lower)/(sma-lower||1);
    bullish = distUpper < distLower;
    const extremity = bullish ? (1-Math.max(0,Math.min(1,distUpper))) : (1-Math.max(0,Math.min(1,distLower)));
    confidence = Math.min(93, Math.max(52, 52 + Math.round(extremity*42)));
    extra = ' (BB ' + (bullish?'upper':'lower') + ' ' + fmt(bullish?upper:lower, 2) + ')';
  } else if (strategyId === 'meanrev') {
    const rsiVal = ind.rsi14[i] != null ? ind.rsi14[i] : 50;
    bullish = rsiVal < 50;
    const extremity = bullish ? Math.max(0, (50-rsiVal)/50) : Math.max(0, (rsiVal-50)/50);
    confidence = Math.min(95, Math.max(52, 52 + Math.round(extremity*86)));
    extra = ' (RSI ' + rsiVal.toFixed(1) + ')';
  } else if (strategyId === 'sr') {
    const kVal = ind.stoch.k[i] != null ? ind.stoch.k[i] : 50;
    bullish = kVal < 50;
    const extremity = bullish ? Math.max(0, (50-kVal)/50) : Math.max(0, (kVal-50)/50);
    confidence = Math.min(93, Math.max(52, 52 + Math.round(extremity*80)));
    extra = ' (%K ' + kVal.toFixed(1) + ')';
  } else if (strategyId === 'macd') {
    const hist = ind.macd.hist[i], prevHist = ind.macd.hist[i-1] || 0;
    bullish = hist > 0;
    const momentum = Math.abs(hist-prevHist)/(Math.abs(last)*0.001 || 1);
    confidence = Math.min(92, Math.max(52, 55 + Math.round(Math.min(momentum,1)*35)));
    extra = ' (hist ' + (hist>=0?'+':'') + hist.toFixed(3) + ')';
  } else { // volume
    const vol = candles[i].volume, avgVol = ind.avgVol20[i];
    const spike = vol / (avgVol || 1);
    const priceUp = candles[i].close >= candles[i].open;
    bullish = priceUp;
    confidence = Math.min(91, Math.max(50, 50 + Math.round(Math.min(spike-1,1.5)*28)));
    extra = ' (vol ' + (spike).toFixed(1) + 'x avg)';
  }

  const reasonKey = 'reason_' + strategyId + '_' + (bullish ? 'bull' : 'bear');

  const mtf = getHigherTFTrend();
  let mtfStatus = null;
  if (mtf) {
    if (mtf.bullish === bullish) { confidence = Math.min(97, confidence + 8); mtfStatus = { agree: true, tf: mtf.tf }; }
    else { confidence = Math.max(35, confidence - 10); mtfStatus = { agree: false, tf: mtf.tf }; }
  }

  const entry = last; const slDist = last * 0.004;
  const sl = bullish ? entry - slDist : entry + slDist;
  const tp = bullish ? entry + slDist*2 : entry - slDist*2;
  return { bullish, confidence, entry, sl, tp, reasonKey, extra, mtfStatus, analyzedAt: Date.now() };
}
function buildResultHTML(res, decimals, idPrefix) {
  idPrefix = idPrefix || 'r';
  return `<div class="result-head"><span class="result-dir ${res.bullish?'bull':'bear'}">${res.bullish?'↗ '+t('bullish'):'↘ '+t('bearish')}</span><span class="conf-pill">${res.confidence}/100</span></div>
    <div class="levels-grid">

      </div>
      <div class="risk-result-grid">
        <div class="level-box sl"><div class="lv-label">${t('risk_loss')}</div><div class="lv-val" id="${idPrefix}RiskLoss">-$10</div></div>
        <div class="level-box tp"><div class="lv-label">${t('risk_gain')}</div><div class="lv-val" id="${idPrefix}RiskGain">+$20</div></div>
      </div>
      <div class="risk-note">${t('risk_note')}</div>
    </div>`;
}
function wireRiskCalculator(idPrefix, res) {
  const balEl = document.getElementById(idPrefix+'RiskBalance');
  const pctEl = document.getElementById(idPrefix+'RiskPercent');
  const lossEl = document.getElementById(idPrefix+'RiskLoss');
  const gainEl = document.getElementById(idPrefix+'RiskGain');
  if (!balEl || !pctEl) return;
  function update() {
    const balance = Math.max(0, parseFloat(balEl.value) || 0);
    const pct = Math.max(0, parseFloat(pctEl.value) || 0);
    const riskAmount = balance * pct / 100;
    const riskPerUnit = Math.abs(res.entry - res.sl) || 1;
    const rewardPerUnit = Math.abs(res.tp - res.entry);
    const gain = riskAmount * (rewardPerUnit / riskPerUnit);
    lossEl.textContent = '-$' + riskAmount.toFixed(2);
    gainEl.textContent = '+$' + gain.toFixed(2);
  }
  balEl.addEventListener('input', update); pctEl.addEventListener('input', update);
  update();
}
const SIGNAL_MARKERS = {};
function logToHistory(pair, res, decimals) {
  const win = Math.random()*100 < res.confidence;
  const closePrice = win ? res.tp : res.sl;
  const dir = res.bullish ? 'BUY' : 'SELL';
  const pips = calcPips(pair, res.entry, closePrice, dir==='BUY');
  const holdMins = 30 + Math.round(Math.random()*150);
  HISTORY.unshift({ pair, dir, open: nowLabel(), close: laterLabel(holdMins), openPrice: res.entry, closePrice, decimals, win, pips, pipsStr: (pips>=0?'+':'')+pips.toFixed(1), isNew: true });
  if (HISTORY.length > 30) HISTORY.pop();

  const key = pair + '_' + state.tf;
  if (!SIGNAL_MARKERS[key]) SIGNAL_MARKERS[key] = [];
  const candles = getCandles(pair, state.tf);
  SIGNAL_MARKERS[key].push({ index: candles.length-1, entry: res.entry, tp: res.tp, sl: res.sl, bullish: res.bullish, win });
  if (SIGNAL_MARKERS[key].length > 8) SIGNAL_MARKERS[key].shift();
}
let analyzing = false;
function runAnalyze() {
  if (analyzing) return; analyzing = true;
  haptic('medium');
  const btn = document.getElementById('analyzeBtn');

    createChart(document.getElementById('sigCanvas'), document.getElementById('sigCross'), candles, p.decimals, res, SIGNAL_MARKERS[state.pair+'_'+state.tf]);
    const panel = document.getElementById('sigResult');
    panel.innerHTML = buildResultHTML(res, p.decimals, 'sig');
    panel.classList.remove('show'); void panel.offsetWidth; panel.classList.add('show');
    wireRiskCalculator('sig', res);
    btn.classList.remove('loading'); document.getElementById('analyzeLabel').textContent = t('analyze_rerun');
    document.getElementById('staleWarning').classList.remove('show');
    logToHistory(state.pair, res, p.decimals);
    sessionAnalyzeCount++;
    haptic('success');
    checkAchievements();
    analyzing = false;
  }, 900);
}

  const rnd = seeded(7); let v = 55; const pts = [];
  for (let i=0;i<20;i++){ v += (rnd()-0.4)*4; v=Math.max(40,Math.min(85,v)); pts.push(v); }
  const w=180,h=50,pad=4; const min=Math.min(...pts),max=Math.max(...pts),range=(max-min)||1;
  const coords = pts.map((p,i)=>`${pad+i*((w-pad*2)/(pts.length-1))},${pad+(1-(p-min)/range)*(h-pad*2)}`).join(' ');
  document.getElementById('statLineChart').innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="filter:drop-shadow(0 0 6px rgba(79,224,194,0.3));"><polyline points="${coords}" fill="none" stroke="var(--bull)" stroke-width="2"/></svg>`;
}
function animateGauge(circleId,numId,target,circumference){
  const c=document.getElementById(circleId), n=document.getElementById(numId);
  let cur=0; const steps=40, inc=target/steps; let i=0;
  const tm=setInterval(()=>{ i++; cur=Math.min(target,cur+inc); c.style.strokeDashoffset=circumference-(cur/100)*circumference; n.textContent=Math.round(cur)+'%'; if(i>=steps) clearInterval(tm); },16);
}

function renderCompareCard() {

function renderSparkline(id, candles) {
  const svg = document.getElementById(id); if (!svg) return;
  const closes = candles.slice(-20).map(c=>c.close);
  const min = Math.min(...closes), max = Math.max(...closes), range=(max-min)||1;
  const pts = closes.map((v,i) => `${i*(70/(closes.length-1))},${24-((v-min)/range)*22-1}`).join(' ');
  const up = closes[closes.length-1] >= closes[0];
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="${up?'#4FE0C2':'#FF6E5A'}" stroke-width="1.6"/>`;
}

/* ============================================================ CANDLE COUNTDOWN ============================================================ */
const TF_SECONDS = { '1m':60, '5m':300, '15m':900, '30m':1800, '1H':3600, '4H':14400, '1D':86400 };
function formatCountdown(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h > 0) return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function spawnNewCandle(pair, tf) {
  const key = pair+'_'+tf;
  const candles = getCandles(pair, tf);
  const lastClose = candles[candles.length-1].close;
  const newCandle = { open: lastClose, close: lastClose, high: lastClose, low: lastClose, volume: Math.round(500+Math.random()*2000) };
  candles.push(newCandle);
  let removed = 0;
  if (candles.length > 90) { candles.shift(); removed = 1; }
  delete candles._ind;
  candles._ema20 = ema(candles, 20);
  if (removed && SIGNAL_MARKERS[key]) {
    SIGNAL_MARKERS[key] = SIGNAL_MARKERS[key].map(m => ({ ...m, index: m.index-removed })).filter(m => m.index >= 0);
  }
}
function flashNewCandleCard(cardSelector) {
  const card = document.querySelector(cardSelector);
  if (card) { card.classList.remove('new-candle-flash'); void card.offsetWidth; card.classList.add('new-candle-flash'); }
}
function onCandleClose(tf) {
  haptic('light');
  spawnNewCandle(state.pair, tf);
  if (document.getElementById('view-signals').classList.contains('active')) {
    lastSigPrice = null; renderSignalsChart(false); flashNewCandleCard('#view-signals .card');
  }
  if (document.getElementById('view-analysis').classList.contains('active')) {
    lastAnaPrice = null; renderPatternCard(getCandles(state.pair, state.tf)); computeStrategyGrid(); renderAnalysisChart();
    flashNewCandleCard('#view-analysis .card');
  }
}
const lastBoundaryByTf = {};
function candleCountdownTick() {
  const tf = state.tf, tfSec = TF_SECONDS[tf];
  const nowSec = Date.now()/1000;
  const boundary = Math.ceil(nowSec/tfSec) * tfSec;
  const secondsLeft = Math.max(0, boundary - nowSec);
  if (lastBoundaryByTf[tf] === undefined) lastBoundaryByTf[tf] = boundary;
  else if (boundary !== lastBoundaryByTf[tf]) { lastBoundaryByTf[tf] = boundary; onCandleClose(tf); }
  const text = '🕐 ' + formatCountdown(secondsLeft);
  ['sigCountdown','anaCountdown'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.textContent = text; el.classList.toggle('urgent', secondsLeft < 10); }
  });
}
setInterval(candleCountdownTick, 1000);

/* ============================================================ LIVE TICK ============================================================ */
let lastAnaPrice = null;
function pulseEl(el) { el.classList.remove('pulse-update'); void el.offsetWidth; el.classList.add('pulse-update'); }

function tickLive() {
  const candles = getCandles(state.pair, state.tf);
  const key = state.pair + '_' + state.tf;
  if (!liveCandleKeys.has(key)) {
    // Only fake-tick demo data. Real candles get refreshed by fetchRealCandles instead.
    const last = candles[candles.length-1];
    const jitter = (Math.random()-0.5) * PAIRS[state.pair].start * 0.0006;
    last.close += jitter; last.high = Math.max(last.high, last.close); last.low = Math.min(last.low, last.close);
    delete candles._ind; // force indicators to recompute with the new tick
    candles._ema20 = ema(candles, 20);
  }

  if (document.getElementById('view-signals').classList.contains('active')) renderSignalsChart(true);

  if (document.getElementById('view-analysis').classList.contains('active')) {

/* ============================================================ PULL TO REFRESH ============================================================ */
let ptrStartY = 0, ptrPulling = false, ptrDistance = 0;
const ptrEl = () => document.getElementById('ptrIndicator');
document.addEventListener('touchstart', e => {
  if (window.scrollY <= 0 && e.touches.length === 1) { ptrStartY = e.touches[0].clientY; ptrPulling = true; }
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!ptrPulling) return;
  const dy = e.touches[0].clientY - ptrStartY;
  if (dy > 0 && window.scrollY <= 0) {
    ptrDistance = Math.min(dy, 90);
    const ind = ptrEl();
    ind.style.transform = `translateY(${ptrDistance}px)`;
    ind.classList.toggle('spinning', ptrDistance > 68);
    ind.querySelector('.ptr-label').textContent = ptrDistance > 68 ? t('release_refresh') : t('pull_refresh');
  }
}, { passive: true });
document.addEventListener('touchend', () => {
  if (!ptrPulling) return;
  const ind = ptrEl();
  if (ptrDistance > 68) {
    ind.querySelector('.ptr-label').textContent = t('refreshing');
    ind.classList.add('spinning');
    setTimeout(() => { tickLive(); tickLive(); ind.style.transform = 'translateY(0)'; ind.classList.remove('spinning'); }, 650);
  } else { ind.style.transform = 'translateY(0)'; ind.classList.remove('spinning'); }
  ptrPulling = false; ptrDistance = 0;
});

swipeZone.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - swipeStartX, dy = e.changedTouches[0].clientY - swipeStartY;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.5) {
    const keys = Object.keys(PAIRS);
    const idx = keys.indexOf(state.pair);

    selectPair(keys[nextIdx]);
  }
});

  if (document.getElementById('view-history').classList.contains('active')) renderAchievements(justUnlocked);

}

}

/* ============================================================ LIVE DATA (Vercel API → Upstash) ============================================================ */
// Viewed here in Claude's artifact preview: fetch('/api/news') has nothing to
// reach (no endpoint exists here) and fails harmlessly — badge stays on
// "Demo data". Once deployed with api/news.js alongside this file (see
// mini-app-project/README.md), the fetch succeeds and real bot-sourced
// news replaces the demo today/yesterday items.
let liveDataActive = false;
function formatLiveTime(iso, day) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  if (day === 'tomorrow') return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ', ' + d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
  return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
}
async function fetchLiveNews() {
  try {
    const res = await fetch('/api/news', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    const items = Array.isArray(data.items) ? data.items : [];
    if (items.length === 0) return;
    const mapped = items.map(it => ({
      id: it.id, day: it.day, currency: it.currency, impact: it.impact,
      time: formatLiveTime(it.time, it.day), actual: it.actual, forecast: it.forecast,
      name: it.name, reason: it.reason, note: it.reason, direction: it.direction,
    }));
    NEWS.length = 0;
    NEWS.push(...mapped);
    liveDataActive = true;
    document.getElementById('liveBadge').textContent = t('badge_live');
    buildCurrChips(); buildNewsList();
  } catch (err) { /* expected before deploy / before the bot has published anything */ }
}
